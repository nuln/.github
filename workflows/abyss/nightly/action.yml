name: Abyss Plugin Nightly
description: Run full integration tests for abyss plugins

inputs:
  go-version:
    description: Go toolchain version
    required: false
    default: "1.26"
  app-id:
    description: GitHub App ID for private dependency access
    required: true
  app-private-key:
    description: GitHub App private key for private dependency access
    required: true

runs:
  using: composite
  steps:
    - name: Generate token
      id: token
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ github.repository_owner }}

    - name: Checkout plugin
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ steps.token.outputs.token }}

    - name: Checkout abyss-core
      uses: actions/checkout@v4
      with:
        repository: nuln/abyss-core
        path: core
        token: ${{ steps.token.outputs.token }}

    - name: Configure Git for private modules
      shell: bash
      run: git config --global url."https://x-access-token:${{ steps.token.outputs.token }}@github.com/".insteadOf "https://github.com/"

    - name: Create frontend dist placeholder
      shell: bash
      run: mkdir -p www/dist && touch www/dist/.gitkeep

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}
        cache: false

    - name: Restore Go module cache
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-mod-${{ inputs.go-version }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-mod-${{ inputs.go-version }}-

    - name: Download Go dependencies
      shell: bash
      env:
        GOPRIVATE: github.com/nuln/*
        GONOSUMDB: github.com/nuln/*
        GOWORK: auto
      run: |
        rm -f go.sum
        go mod download
        go mod tidy

    - name: Run integration tests
      shell: bash
      env:
        GOWORK: auto
      run: make test-integration

    - name: Evict nuln modules from Go module cache
      if: always()
      shell: bash
      run: rm -rf "$HOME/go/pkg/mod/github.com/nuln"
