name: Abyss Plugin Dependency Scan
description: Run vulnerability checks for abyss plugins

inputs:
  go-version:
    description: Go toolchain version
    required: false
    default: "1.26"
  app-id:
    description: GitHub App ID for private dependency access
    required: false
    default: ""
  app-private-key:
    description: GitHub App private key for private dependency access
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Generate token
      id: token
      if: ${{ inputs.app-id != '' && inputs.app-private-key != '' }}
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ github.repository_owner }}

    - name: Resolve auth token
      id: auth
      shell: bash
      run: |
        token='${{ steps.token.outputs.token }}'
        if [ -z "$token" ]; then
          token='${{ github.token }}'
        fi
        echo "token=$token" >> "$GITHUB_OUTPUT"

    - name: Checkout plugin
      uses: actions/checkout@v4
      with:
        token: ${{ steps.auth.outputs.token }}

    - name: Checkout abyss
      uses: actions/checkout@v4
      with:
        repository: nuln/abyss
        path: core
        token: ${{ steps.auth.outputs.token }}

    - name: Configure Git for private modules
      shell: bash
      run: git config --global url."https://x-access-token:${{ steps.auth.outputs.token }}@github.com/".insteadOf "https://github.com/"

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}
        cache: false

    - name: Restore Go module cache
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-mod-${{ inputs.go-version }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-mod-${{ inputs.go-version }}-

    - name: Download Go dependencies
      shell: bash
      env:
        GOPRIVATE: github.com/nuln/*
        GONOSUMDB: github.com/nuln/*
      run: go mod tidy

    - name: Run vulnerability check
      shell: bash
      env:
        GOPRIVATE: github.com/nuln/*
        GONOSUMDB: github.com/nuln/*
      run: make vulnerability-check

    - name: Evict nuln modules from Go module cache
      if: always()
      shell: bash
      run: rm -rf "$HOME/go/pkg/mod/github.com/nuln"
