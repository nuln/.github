name: Abyss Plugin CI
description: Run lint and unit tests for abyss plugins

inputs:
  go-version:
    description: Go toolchain version
    required: false
    default: "1.26"
  app-id:
    description: GitHub App ID for private dependency access
    required: true
  app-private-key:
    description: GitHub App private key for private dependency access
    required: true

runs:
  using: composite
  steps:
    - name: Generate token
      id: token
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ github.repository_owner }}

    - name: Checkout plugin
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ steps.token.outputs.token }}

    - name: Checkout abyss-core
      uses: actions/checkout@v4
      with:
        repository: nuln/abyss-core
        path: core
        token: ${{ steps.token.outputs.token }}

    - name: Configure Git for private modules
      shell: bash
      run: git config --global url."https://x-access-token:${{ steps.token.outputs.token }}@github.com/".insteadOf "https://github.com/"

    - name: Create frontend dist placeholder
      shell: bash
      run: mkdir -p www/dist && touch www/dist/.gitkeep

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}
        cache: false

    - name: Restore Go module cache
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-mod-${{ inputs.go-version }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-mod-${{ inputs.go-version }}-

    - name: Restore golangci-lint binary cache
      id: golangci-bin-cache
      uses: actions/cache@v4
      with:
        path: ~/go/bin/golangci-lint
        key: ${{ runner.os }}-golangci-bin-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-golangci-bin-

    - name: Restore golangci-lint analysis cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/golangci-lint
        key: ${{ runner.os }}-golangci-cache-${{ hashFiles('**/.golangci.yml', '**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-golangci-cache-

    - name: Download Go dependencies
      shell: bash
      env:
        GOPRIVATE: github.com/nuln/*
        GONOSUMDB: github.com/nuln/*
        GOWORK: auto
      run: |
        rm -f go.sum
        go mod download
        go mod tidy

    - name: Install golangci-lint
      if: steps.golangci-bin-cache.outputs.cache-hit != 'true'
      shell: bash
      run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

    - name: Run lint
      shell: bash
      env:
        GOWORK: auto
      run: make lint SETUP_TOOLS=false SETUP_PNPM=false

    - name: Run unit tests
      shell: bash
      env:
        GOWORK: auto
      run: make test

    - name: Evict nuln modules from Go module cache
      if: always()
      shell: bash
      run: rm -rf "$HOME/go/pkg/mod/github.com/nuln"
