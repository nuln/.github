name: Abyss Plugin Assets Release
description: Build and publish plugin release assets

inputs:
  app-id:
    description: GitHub App ID for private dependency access
    required: false
    default: ""
  app-private-key:
    description: GitHub App private key for private dependency access
    required: false
    default: ""
  plugin-dir:
    description: Relative plugin directory inside caller repository
    required: false
    default: .
  core-repo:
    description: Abyss core repository to checkout
    required: false
    default: nuln/abyss
  go-version:
    description: Go toolchain version
    required: false
    default: "1.25.3"
  node-version:
    description: Node.js version
    required: false
    default: "24"
  pnpm-version:
    description: pnpm version
    required: false
    default: "10"
  release-tag:
    description: Tag name used for release assets
    required: true
  repo-token:
    description: Repository token used for tag push (typically secrets.GITHUB_TOKEN)
    required: true
  core-replace-path:
    description: Replace path for github.com/nuln/abyss in go.mod
    required: false
    default: ./core
  make-core-dir:
    description: CORE_DIR override passed to plugin Makefile
    required: false
    default: core
  make-plugin-path:
    description: PLUGIN_PATH override passed to plugin Makefile
    required: false
    default: ..

runs:
  using: composite
  steps:
    - name: Generate token
      id: token
      if: ${{ inputs.app-id != '' && inputs.app-private-key != '' }}
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ github.repository_owner }}

    - name: Resolve auth token
      id: auth
      shell: bash
      run: |
        token='${{ steps.token.outputs.token }}'
        if [ -z "$token" ]; then
          token='${{ github.token }}'
        fi
        echo "token=$token" >> "$GITHUB_OUTPUT"

    - name: Checkout plugin
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ inputs.repo-token }}

    - name: Checkout core
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.core-repo }}
        path: core
        token: ${{ steps.auth.outputs.token }}

    - name: Configure Git for private modules
      shell: bash
      run: |
        git config --global url."https://x-access-token:${{ steps.auth.outputs.token }}@github.com/".insteadOf "https://github.com/"

    - name: Configure origin push token
      shell: bash
      run: |
        git remote set-url origin "https://x-access-token:${{ inputs.repo-token }}@github.com/${{ github.repository }}.git"

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}
        cache: true
        cache-dependency-path: ${{ inputs.plugin-dir }}/go.mod

    - name: Refresh internal module cache
      shell: bash
      working-directory: ${{ inputs.plugin-dir }}
      run: make clean-internal-cache

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: core/www/pnpm-lock.yaml

    - name: Release assets
      shell: bash
      working-directory: ${{ inputs.plugin-dir }}
      env:
        GOPRIVATE: github.com/nuln/*
      run: |
        go mod edit -replace github.com/nuln/abyss=${{ inputs.core-replace-path }}
        make assets TAG=${{ inputs.release-tag }} CORE_DIR=${{ inputs.make-core-dir }} PLUGIN_PATH=${{ inputs.make-plugin-path }}
