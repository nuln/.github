# Reusable Assets Build & Release workflow for abyss plugin repositories.
# Caller: uses: nuln/.github/workflows/abyss/assets.yml@master
#         secrets: inherit
#         with:
#           tag: v0.1.0  # required: the version tag to build and release
#
# Runs: make assets (build frontend, commit www/dist, tag, and force-push).
# Trigger: called manually or from a release workflow.
name: Plugin Assets Release

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.1.0)'
        required: true
        type: string

jobs:
  assets:
    name: Build & Release Assets
    runs-on: ubuntu-latest
    steps:
      - name: Generate token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ABYSS_ACCESS_APP_ID }}
          private-key: ${{ secrets.ABYSS_ACCESS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}

      - name: Checkout abyss-core
        uses: actions/checkout@v4
        with:
          repository: nuln/abyss-core
          path: core
          token: ${{ steps.token.outputs.token }}

      - name: Configure Git for private modules
        run: |
          git config --global url."https://x-access-token:${{ steps.token.outputs.token }}@github.com/".insteadOf "https://github.com/"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Build assets
        run: make assets TAG=${{ inputs.tag }}
        env:
          SETUP_TOOLS: 'false'
          SETUP_PNPM: 'true'
