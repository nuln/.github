# Reusable Dependency Scan workflow for all abyss plugin repositories.
# Caller: uses: nuln/.github/workflows/abyss/scan.yml@master
#         secrets: inherit
#
# Runs: govulncheck on the full module graph.
# Trigger: called from each plugin's scan.yml (weekly schedule + workflow_dispatch).
name: Plugin Dependency Scan

on:
  workflow_call:
    inputs:
      go-version:
        description: 'Go toolchain version'
        required: false
        type: string
        default: '1.26'

jobs:
  scan:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - name: Generate token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ABYSS_ACCESS_APP_ID }}
          private-key: ${{ secrets.ABYSS_ACCESS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          token: ${{ steps.token.outputs.token }}

      - name: Checkout abyss-core
        uses: actions/checkout@v4
        with:
          repository: nuln/abyss-core
          path: core
          token: ${{ steps.token.outputs.token }}

      - name: Configure Git for private modules
        run: git config --global url."https://x-access-token:${{ steps.token.outputs.token }}@github.com/".insteadOf "https://github.com/"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache: false

      - name: Restore Go module cache
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ inputs.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-${{ inputs.go-version }}-

      - name: Download Go dependencies
        env:
          GOPRIVATE: github.com/nuln/*
          GONOSUMDB: github.com/nuln/*
        run: go mod tidy

      - name: Run vulnerability check
        env:
          GOPRIVATE: github.com/nuln/*
          GONOSUMDB: github.com/nuln/*
        run: make vulnerability-check

      - name: Evict nuln modules from Go module cache
        if: always()
        run: rm -rf "$HOME/go/pkg/mod/github.com/nuln"
