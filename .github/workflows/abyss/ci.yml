# Reusable CI workflow for all abyss plugin repositories.
# Caller: uses: nuln/.github/workflows/abyss/ci.yml@master
#         secrets: inherit
#
# Jobs run in parallel:
#   lint  — golangci-lint (with binary + analysis cache, no nuln modules in cache)
#   test  — go test -v -short ./... (unit tests only)
#
# Cache policy:
#   ~/go/pkg/mod       — external modules only; nuln/* evicted before save
#   ~/.cache/golangci-lint — lint analysis results
#   ~/go/bin/golangci-lint — compiled binary
name: Plugin CI

on:
  workflow_call:
    inputs:
      go-version:
        description: 'Go toolchain version'
        required: false
        type: string
        default: '1.26'

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Lint (golangci-lint)
  # ─────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Generate token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ABYSS_ACCESS_APP_ID }}
          private-key: ${{ secrets.ABYSS_ACCESS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}

      - name: Checkout abyss-core
        uses: actions/checkout@v4
        with:
          repository: nuln/abyss-core
          path: core
          token: ${{ steps.token.outputs.token }}

      - name: Configure Git for private modules
        run: git config --global url."https://x-access-token:${{ steps.token.outputs.token }}@github.com/".insteadOf "https://github.com/"

      - name: Create frontend dist placeholder
        run: mkdir -p www/dist && touch www/dist/.gitkeep

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache: false   # managed manually to allow nuln exclusion

      # ── Cache: Go module cache (external only) ──────────────────────────
      - name: Restore Go module cache
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ inputs.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-${{ inputs.go-version }}-

      # ── Cache: golangci-lint compiled binary ─────────────────────────────
      - name: Restore golangci-lint binary cache
        id: golangci-bin-cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin/golangci-lint
          key: ${{ runner.os }}-golangci-bin-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-golangci-bin-

      # ── Cache: golangci-lint analysis results ────────────────────────────
      - name: Restore golangci-lint analysis cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/golangci-lint
          key: ${{ runner.os }}-golangci-cache-${{ hashFiles('**/.golangci.yml', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-golangci-cache-

      - name: Download Go dependencies
        env:
          GOPRIVATE: github.com/nuln/*
          GONOSUMDB: github.com/nuln/*
          GOWORK: auto
        run: |
          rm -f go.sum
          go mod download
          go mod tidy

      - name: Install golangci-lint
        if: steps.golangci-bin-cache.outputs.cache-hit != 'true'
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run lint
        run: make lint SETUP_TOOLS=false SETUP_PNPM=false
        env:
          GOWORK: auto

      # Evict nuln private modules BEFORE actions/cache saves the snapshot.
      # The post-step of actions/cache runs after all regular steps, so
      # placing this last ensures the saved cache never contains nuln code.
      - name: Evict nuln modules from Go module cache
        if: always()
        run: rm -rf "$HOME/go/pkg/mod/github.com/nuln"

  # ─────────────────────────────────────────────
  # Job 2: Unit Tests  (runs in parallel with lint)
  # ─────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Generate token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ABYSS_ACCESS_APP_ID }}
          private-key: ${{ secrets.ABYSS_ACCESS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}

      - name: Checkout abyss-core
        uses: actions/checkout@v4
        with:
          repository: nuln/abyss-core
          path: core
          token: ${{ steps.token.outputs.token }}

      - name: Configure Git for private modules
        run: git config --global url."https://x-access-token:${{ steps.token.outputs.token }}@github.com/".insteadOf "https://github.com/"

      - name: Create frontend dist placeholder
        run: mkdir -p www/dist && touch www/dist/.gitkeep

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache: false

      - name: Restore Go module cache
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ inputs.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-${{ inputs.go-version }}-

      - name: Download Go dependencies
        env:
          GOPRIVATE: github.com/nuln/*
          GONOSUMDB: github.com/nuln/*
          GOWORK: auto
        run: |
          rm -f go.sum
          go mod download
          go mod tidy

      - name: Run unit tests
        run: make test
        env:
          GOWORK: auto

      - name: Evict nuln modules from Go module cache
        if: always()
        run: rm -rf "$HOME/go/pkg/mod/github.com/nuln"
