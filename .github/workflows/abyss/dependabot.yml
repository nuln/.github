# Dependabot auto-approval and merge workflow.
# This workflow runs on dependabot PRs to automatically approve and merge minor/patch updates.
# Configure: Add to each plugin's workflows; no `uses` call needed (runs directly).
name: Dependabot

on:
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'
  pull_request_target:
    branches:
      - master

permissions:
  pull-requests: write
  contents: write

jobs:
  dependabot:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v1
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
